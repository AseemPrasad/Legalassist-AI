name: "First Interaction Welcome"

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Check if first-time contributor
        id: check
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to LegalAssist AI! Thank you for opening your first issue.

            Please make sure to:
            1. Check our [Contributing Guidelines](https://github.com/AseemPrasad/Legalassist-AI/blob/main/CONTRIBUTING.md)
            2. Review the [Code of Conduct](https://github.com/AseemPrasad/Legalassist-AI/blob/main/docs/code_of_conduct.md)
            3. Search for existing issues to avoid duplicates

            A maintainer will review your issue shortly. Thank you for helping improve legal access! ⚖️
          pr-message: |
            🎉 Thank you for submitting your first pull request to LegalAssist AI!

            A maintainer will review your changes. In the meantime:
            1. Ensure your PR references a related issue (if applicable)
            2. Verify all CI checks pass
            3. Check that your changes follow the project conventions

            Welcome aboard and thank you for contributing! ⚖️
